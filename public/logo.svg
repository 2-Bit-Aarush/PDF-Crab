<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with subtle gradient -->
  <circle cx="32" cy="32" r="30" fill="url(#logoGrad)" stroke="#ff8c3c" stroke-width="2"/>
  
  <!-- Crab body - simplified, iconic -->
  <g fill="#ff8c3c">
    <!-- Main shell -->
    <ellipse cx="32" cy="38" rx="16" ry="10"/>
    <!-- Upper shell -->
    <ellipse cx="32" cy="32" rx="12" ry="8"/>
    <!-- Head area -->
    <ellipse cx="32" cy="26" rx="8" ry="5"/>
  </g>
  
  <!-- Inner shell highlight -->
  <g fill="#ffab6b" opacity="0.8">
    <ellipse cx="32" cy="35" rx="8" ry="4"/>
    <ellipse cx="32" cy="29" rx="5" ry="3"/>
  </g>
  
  <!-- Eyes - expressive, larger -->
  <g>
    <circle cx="26" cy="26" r="5" fill="#0a0b0e"/>
    <circle cx="38" cy="26" r="5" fill="#0a0b0e"/>
    <!-- Pupils with catchlights -->
    <circle cx="25" cy="25" r="1.5" fill="#fff"/>
    <circle cx="37" cy="25" r="1.5" fill="#fff"/>
    <!-- Inner pupil -->
    <circle cx="25" cy="25" r="0.5" fill="#ff8c3c"/>
    <circle cx="37" cy="25" r="0.5" fill="#ff8c3c"/>
  </g>
  
  <!-- Claws - iconic, recognizable -->
  <g stroke="#ff8c3c" stroke-width="3" stroke-linecap="round" fill="none">
    <!-- Left claw -->
    <path d="M12 38 Q6 32 10 26 Q14 30 12 38"/>
    <path d="M12 38 Q6 42 10 48 Q14 44 12 38"/>
    <!-- Right claw -->
    <path d="M52 38 Q58 32 54 26 Q50 30 52 38"/>
    <path d="M52 38 Q58 42 54 48 Q50 44 52 38"/>
  </g>
  
  <!-- Legs - subtle, pixel-perfect -->
  <g stroke="#ff8c3c" stroke-width="2" stroke-linecap="round">
    <path d="M16 46 Q12 50 8 52"/>
    <path d="M24 48 Q22 52 20 54"/>
    <path d="M40 48 Q42 52 44 54"/>
    <path d="M48 46 Q52 50 56 52"/>
  </g>
  
  <!-- Pixel accent dots on shell -->
  <g fill="#ff8c3c" opacity="0.6">
    <rect x="24" y="30" width="2" height="2" rx="1"/>
    <rect x="38" y="30" width="2" height="2" rx="1"/>
    <rect x="28" y="36" width="2" height="2" rx="1"/>
    <rect x="36" y="36" width="2" height="2" rx="1"/>
  </g>

  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111318"/>
      <stop offset="50%" stop-color="#0e1015"/>
      <stop offset="100%" stop-color="#0a0b0e"/>
    </linearGradient>
  </defs>
</svg>